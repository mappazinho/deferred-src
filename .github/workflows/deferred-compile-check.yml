name: Deferred Windows compile check

on:
  push:
    branches:
      - deferred-sdk2013-compat

# Temporary compile-only validation for the deferred port.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: microsoft/setup-msbuild@v2
      - name: Generate Source SDK projects
        working-directory: src
        shell: cmd
        run: |
          call creategameprojects.bat
          if exist game\client\client_episodic.vcxproj exit /b 0
          exit /b 1
      - name: Compile episodic client
        working-directory: src
        shell: cmd
        run: msbuild game\client\client_episodic.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal /nologo
