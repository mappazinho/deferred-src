name: Deferred SDK2013 pass 2

on:
  push:
    branches:
      - deferred-sdk2013-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply compatibility pass
        run: python3 tools/patch_deferred_sdk2013_pass2.py
      - name: Commit pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deferred-sdk2013-pass2.yml tools/patch_deferred_sdk2013_pass2.py
          git add src/game/client/deferred/viewrender_deferred.cpp src/game/client/deferred/clight_manager.cpp
          git commit -m "port deferred frame shell to SDK 2013 APIs"
          git push
