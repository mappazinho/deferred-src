name: Deferred SDK2013 compatibility patch

on:
  push:
    branches:
      - deferred-sdk2013-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply SDK 2013 compatibility patch
        run: python3 tools/patch_deferred_sdk2013.py
      - name: Commit compatibility pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deferred-port-patch.yml tools/patch_deferred_sdk2013.py
          git add src/game/client/viewrender.h src/game/client/deferred/viewrender_deferred.cpp
          git commit -m "port deferred renderer plumbing to SDK 2013 SP"
          git push
