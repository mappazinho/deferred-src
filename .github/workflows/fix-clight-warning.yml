name: Fix deferred light-manager compile warning

on:
  push:
    branches:
      - deferred-sdk2013-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 tools/fix_clight_manager_warning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-clight-warning.yml tools/fix_clight_manager_warning.py
          git add src/game/client/deferred/clight_manager.cpp
          git commit -m "fix deferred light batch index type"
          git push
