name: Apply deferred G-buffer view-state patch

on:
  push:
    branches:
      - fix/deferred-gbuffer-view-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deferred-gbuffer-view-state
      - name: Keep G-buffer draw view consistent with its renderable list
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/game/client/deferred/viewrender_deferred.cpp")
          text = path.read_text(encoding="utf-8")
          old = "\tint savedViewID = g_CurrentViewID;\n\tg_CurrentViewID = viewID;\n"
          new = (
              "\tint savedViewID = g_CurrentViewID;\n"
              "\t// The G-buffer renderable list is built using the SDK shadow-depth view.\n"
              "\t// Draw it under the same view classification so studio-model state stays consistent.\n"
              "\tg_CurrentViewID = ( viewID == VIEW_DEFERRED_GBUFFER ) ?\n"
              "\t\tVIEW_SHADOW_DEPTH_TEXTURE : viewID;\n"
          )
          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f"expected one DrawExecute view-ID assignment, found {matches}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/client/deferred/viewrender_deferred.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Keep deferred G-buffer model view state consistent"
          git push origin HEAD:fix/deferred-gbuffer-view-state
