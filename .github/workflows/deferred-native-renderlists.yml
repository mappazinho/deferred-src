name: Deferred native SDK2013 render-list conversion

on:
  push:
    branches:
      - deferred-sdk2013-compat

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply native render-list conversion
        run: python3 tools/patch_deferred_native_renderlists.py
      - name: Commit renderer conversion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deferred-native-renderlists.yml tools/patch_deferred_native_renderlists.py
          git add src/game/client/deferred/viewrender_deferred.cpp
          git commit -m "use native SDK 2013 render lists in deferred renderer"
          git push
