name: SDK2013 server compatibility

on:
  push:
    branches:
      - deferred-sdk2013-compat

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: microsoft/setup-msbuild@v2
      - name: Apply SDK 2013 server fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/game/shared/deferred/CDefLight.cpp',
              'Q_strlen( GetEntityNameAsCStr() ) > 0;',
              'Q_strlen( STRING( GetEntityName() ) ) > 0;',
              'SDK2013 entity-name API')

          replace_once(
              'src/game/shared/deferred/CDefLightContainer.h',
              'ushort &seed, uint8 &cookie, uint8 &flags, uint8 &lighttype );',
              'unsigned short &seed, uint8 &cookie, uint8 &flags, uint8 &lighttype );',
              'container seed declaration')

          replace_once(
              'src/game/shared/deferred/CDefLightContainer.cpp',
              'ushort &seed, uint8 &cookie, uint8 &flags, uint8 &lighttype )',
              'unsigned short &seed, uint8 &cookie, uint8 &flags, uint8 &lighttype )',
              'container seed definition')

          # Modern MSVC can launch several CL.EXE processes against the same
          # compiler PDB when Visual Studio builds the generated server project.
          # Serialize PDB writes rather than forcing users to disable parallel builds.
          p = Path('src/game/server/server_base.vpc')
          s = p.read_text(encoding='utf-8')
          anchor = '\t\t$Create/UsePCHThroughFile\t\t"cbase.h"\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'server_base compiler anchor: expected 1 match, got {s.count(anchor)}')
          s = s.replace(anchor, anchor + '\t\t$AdditionalOptions\t\t\t"$BASE /FS"\t[$WIN32]\n', 1)
          p.write_text(s, encoding='utf-8')
      - name: Generate Source SDK projects
        working-directory: src
        shell: cmd
        run: |
          call creategameprojects.bat
          if exist game\server\server_episodic.vcxproj exit /b 0
          exit /b 1
      - name: Compile Episodic server
        working-directory: src
        shell: cmd
        run: msbuild game\server\server_episodic.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal /nologo
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sdk2013-server-compat.yml
          git add src/game/shared/deferred/CDefLight.cpp src/game/shared/deferred/CDefLightContainer.h src/game/shared/deferred/CDefLightContainer.cpp src/game/server/server_base.vpc
          git commit -m "port deferred server light code to SDK 2013"
          git push
